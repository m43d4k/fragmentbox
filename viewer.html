<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fragmentbox</title>
  <link rel="stylesheet" href="/css/viewer.css?v=sidebar-navigation">
</head>
<body>

<aside id="folder-pane" aria-label="フォルダとタグ">
  <div id="sidebar-head">
    <div class="brand-mark" aria-hidden="true">f</div>
    <div><p class="eyebrow">LOCAL VAULT</p><h2>FragmentBox</h2></div>
  </div>
  <div id="area-switch" role="group" aria-label="記事の範囲">
    <button id="general-link" type="button" aria-pressed="true">General</button>
    <button id="archive-link" type="button" aria-pressed="false">Archive</button>
  </div>
  <section id="folder-section" aria-labelledby="folder-heading">
  <div class="sidebar-section-heading">
    <h2 id="folder-heading">フォルダ</h2>
    <span id="folder-count" class="section-count" aria-label="フォルダ数">0</span>
    <button id="add-folder" aria-label="フォルダを作成" title="フォルダを作成">+</button>
  </div>
  <form id="folder-form" hidden>
    <input id="folder-name" aria-label="フォルダ名" placeholder="フォルダ名" required autocomplete="off">
    <button type="submit">作成</button>
    <button id="folder-cancel" type="button">取消</button>
  </form>
  <nav id="folder-list" aria-label="フォルダ一覧"></nav>
  <nav id="archive-folders" aria-label="アーカイブ内のフォルダ" hidden></nav>
  <p id="folder-empty" hidden>フォルダはありません</p>
  </section>
<section id="tag-section" aria-labelledby="tag-heading">
  <div class="sidebar-section-heading"><h2 id="tag-heading">タグ</h2><span id="tag-count" class="section-count" aria-label="タグ数">0</span></div>
  <div id="tag-filters">
    <div id="tag-controls">
      <input id="tag-search" type="search" placeholder="タグを検索" aria-label="タグを検索" autocomplete="off">
      <button id="tag-mode-btn" class="tag-mode-btn" title="Toggle AND/OR">AND</button>
      <button id="tag-clear-btn" class="tag-clear-btn" disabled>Clear</button>
    </div>
  </div>
</section>
  <div id="sidebar-foot">ローカル保存 · General</div>
</aside>
<main>
<div id="viewer-scroll">
<div id="status-message" role="alert" hidden></div>
<header>
  <div id="header-top">
    <h1>fragmentbox</h1>
    <div id="header-right">
      <button id="fav-filter-btn" class="fav-filter-btn" title="Show favorites only">♥</button>
      <button id="search-toggle" type="button" aria-label="記事を検索" title="記事を検索" aria-expanded="false" aria-controls="search-panel"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button>
    </div>
  </div>
</header>

<div id="fragments">
  <div id="count"></div>
  <div id="cards"></div>
  <div id="empty" style="display:none">No notes found</div>
</div>

</div>
<form id="composer" aria-label="投稿">
  <div id="post-target">投稿先フォルダを選択してください</div>
  <div id="post-body">
    <textarea id="post-text" aria-label="投稿本文" placeholder="メモを入力…" spellcheck="false"></textarea>
    <div id="post-tags" aria-label="投稿タグ"></div>
  </div>
  <div id="post-actions">
    <span id="post-status" role="status" aria-live="polite"></span>
    <input id="post-files" type="file" multiple hidden>
    <button id="post-image" type="button">添付</button>
    <button id="post-save" type="submit">Save</button>
  </div>
</form>
</main>

<aside id="search-panel" aria-labelledby="search-heading" hidden>
  <div id="search-panel-heading">
    <button id="search-back" type="button" aria-label="検索を閉じて戻る">←</button>
    <h2 id="search-heading">記事を検索</h2>
    <button id="search-close" type="button" aria-label="検索を閉じる">×</button>
  </div>
  <div id="search-controls">
    <input id="search" type="search" placeholder="記事を検索…" aria-label="記事を検索" autocomplete="off">
    <div id="date-filter" role="group" aria-label="記事の期間">
      <input id="date-from" type="date" title="開始日" aria-label="開始日">
      <span aria-hidden="true">–</span>
      <input id="date-to" type="date" title="終了日" aria-label="終了日">
      <button id="date-clear-btn" type="button" class="tag-clear-btn" aria-label="期間を解除" style="display:none">✕</button>
    </div>
  </div>
  <div id="search-scroll">
    <div id="search-status" role="alert" hidden></div>
    <div id="search-count" role="status" aria-live="polite"></div>
    <div id="search-cards"></div>
    <p id="search-empty">検索する言葉や期間を指定してください。</p>
  </div>
</aside>

<div id="lightbox" style="display:none">
  <img id="lightbox-img" src="" alt="">
</div>

<div id="confirm-overlay" style="display:none">
  <div id="confirm-dialog" role="alertdialog" aria-modal="true" aria-describedby="confirm-message">
    <p id="confirm-message">元に戻せません。</p>
    <div id="confirm-buttons">
      <button id="confirm-cancel">Cancel</button>
      <button id="confirm-ok">完全に削除</button>
    </div>
  </div>
</div>

<script src="/vendor/marked.umd.js"></script>
<script src="/vendor/purify.min.js"></script>
<script>
  let allFragments = [];
  let fragmentsReady = false;
  const editDrafts = new Map();
  const expandedArticles = new Set();
  const searchExpandedArticles = new Set();
  let activeTags = new Set();
  let searchQuery = "";
  let tagMode = "AND"; // "AND" | "OR"
  let dateFrom = "";
  let dateTo = "";
  let currentSource = "inbox";
  let currentFolder = "";
  let folders = [];
  let archiveFolders = [];
  let loadVersion = 0;
  let folderBusy = false;
  let draggedFolder = null;
  let showFavoritesOnly = false;
  let composerBusy = false;
  let composerReady = false;
  let imageExtensions = [];
  let imageMaxBytes = 0;
  let attachmentExtensions = [];
  let attachmentMaxBytes = 0;

  function readFolderSelection() {
    const saved = sessionStorage.getItem("fragmentbox.folder");
    if (!saved) return { source: "inbox", folder: "" };
    const selection = JSON.parse(saved);
    if (!selection || !["notes", "inbox", "archive"].includes(selection.source)
        || typeof selection.folder !== "string") throw new Error("保存されたフォルダ指定が不正です");
    return selection;
  }

  function rememberFolderSelection() {
    try {
      sessionStorage.setItem("fragmentbox.folder", JSON.stringify({ source: currentSource, folder: currentFolder }));
    } catch (error) { showError(new Error(`フォルダ選択を記憶できません: ${error.message}`)); }
  }

  function canPost() {
    return composerReady && currentSource !== "archive" && (currentSource !== "notes" || currentFolder !== "");
  }

  function updateComposer() {
    document.getElementById("post-target").textContent = currentSource === "archive"
      ? "Archiveには投稿できません"
      : currentSource === "notes" && !currentFolder ? "投稿先フォルダを選択してください"
      : `投稿先: ${currentFolder || "inbox"}`;
    document.getElementById("post-text").disabled = composerBusy;
    document.querySelectorAll("#composer button, #composer input").forEach(el => {
      el.disabled = composerBusy || !canPost();
    });
  }

  function setComposerBusy(busy) {
    composerBusy = busy;
    renderFolders();
    document.querySelectorAll("#archive-link, #folder-form input, #folder-form button").forEach(el => { el.disabled = busy; });
  }

  async function initComposer() {
    try {
      const config = await request("/api/composer");
      imageExtensions = config.image_extensions;
      imageMaxBytes = config.image_max_bytes;
      attachmentExtensions = config.attachment_extensions;
      attachmentMaxBytes = config.attachment_max_bytes;
      document.getElementById("post-files").accept = [...imageExtensions, ...attachmentExtensions].join(",");
      config.tags.forEach(tag => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = `#${tag}`;
        button.addEventListener("click", async () => {
          const text = document.getElementById("post-text");
          const original = text.value;
          try {
            const result = await request("/api/tags/analyze", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ content: original }),
            });
            if (text.value !== original) return;
            if (!result.tags.includes(tag)) text.value += result.separator + `#${tag}`;
            text.focus();
          } catch (error) { showError(error); }
        });
        document.getElementById("post-tags").appendChild(button);
      });
      composerReady = true;
      updateComposer();
    } catch (error) {
      document.getElementById("post-status").textContent = `投稿設定を取得できませんでした: ${error.message}。ビューアを再起動してページを再読み込みしてください。入力内容は保持されます。`;
    }
  }

  function supportedImage(file) {
    return imageExtensions.some(ext => file.name.toLowerCase().endsWith(ext));
  }

  function supportedAttachment(file) {
    return supportedImage(file) || attachmentExtensions.some(ext => file.name.toLowerCase().endsWith(ext));
  }

  async function attachImages(files) {
    if (composerBusy || folderBusy || !canPost()) return;
    const images = [...files].filter(supportedAttachment);
    if (!images.length) return;
    setComposerBusy(true);
    const status = document.getElementById("post-status");
    const text = document.getElementById("post-text");
    try {
      for (const file of images) {
        const isImage = supportedImage(file);
        const limit = isImage ? imageMaxBytes : attachmentMaxBytes;
        if (file.size > limit) throw new Error(`${file.name}: ${limit / 1024 / 1024} MiB以下にしてください`);
        status.textContent = `添付ファイルを保存中: ${file.name}`;
        const result = await request(`/api/${isImage ? "images" : "attachments"}?${new URLSearchParams({ filename: file.name })}`, {
          method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: file,
        });
        text.value += (text.value && !text.value.endsWith("\n") ? "  \n" : "") + result.markdown;
      }
      status.textContent = "ファイルを添付しました";
    } catch (error) { status.textContent = error.message; }
    finally { setComposerBusy(false); text.focus(); document.getElementById("post-files").value = ""; }
  }

  document.getElementById("post-image").addEventListener("click", () => document.getElementById("post-files").click());
  document.getElementById("post-files").addEventListener("change", e => attachImages(e.target.files));
  const postText = document.getElementById("post-text");
  postText.addEventListener("dragover", e => {
    if (composerBusy || !canPost()) return;
    const files = [...e.dataTransfer.items].filter(item => item.kind === "file");
    if (files.some(item => {
      const file = item.getAsFile();
      return file ? supportedAttachment(file) : true;
    })) { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; }
  });
  postText.addEventListener("drop", e => {
    if ([...e.dataTransfer.files].some(supportedAttachment)) {
      e.preventDefault();
      attachImages(e.dataTransfer.files);
    }
  });
  document.getElementById("composer").addEventListener("keydown", e => {
    const mac = /Mac|iPhone|iPad/.test(navigator.platform);
    const save = e.key.toLowerCase() === "s" && (mac ? e.metaKey : e.ctrlKey);
    const enter = e.key === "Enter" && (e.ctrlKey || (mac && e.metaKey));
    if (!e.isComposing && (save || enter)) {
      e.preventDefault();
      document.getElementById("composer").requestSubmit();
    }
  });
  document.getElementById("composer").addEventListener("submit", async e => {
    e.preventDefault();
    if (composerBusy || folderBusy || !canPost()) return;
    const status = document.getElementById("post-status");
    if (!postText.value.trim()) { status.textContent = "本文を入力してください"; return; }
    const query = scopeQuery().toString();
    setComposerBusy(true);
    status.textContent = "URL情報を取得して保存中…";
    try {
      const result = await request(`/api/fragments?${query}`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: postText.value }),
      });
      postText.value = "";
      status.textContent = result.warnings.length ? `保存しました。${result.warnings.join(" / ")}` : "保存しました";
      await load();
    } catch (error) { status.textContent = error.message; }
    finally { setComposerBusy(false); postText.focus(); }
  });

  function showError(error) {
    const el = document.getElementById("status-message");
    el.textContent = error.message;
    el.hidden = false;
    if (!document.getElementById("search-panel").hidden) {
      const searchStatus = document.getElementById("search-status");
      searchStatus.textContent = error.message;
      searchStatus.hidden = false;
    }
  }

  async function request(url, options) {
    const response = await fetch(url, options);
    if (!response.ok) {
      const data = await response.json().catch(() => ({}));
      throw new Error(typeof data.detail === "string" ? data.detail : `Request failed (${response.status})`);
    }
    return response.json();
  }

  function scopeQuery() {
    return new URLSearchParams({ source: currentSource, folder: currentFolder });
  }

  function renderFolders() {
    updateComposer();
    const archive = currentSource === "archive";
    const busy = folderBusy || composerBusy;
    const list = document.getElementById("folder-list");
    list.replaceChildren();
    list.hidden = archive;
    document.getElementById("add-folder").disabled = busy;
    document.getElementById("add-folder").hidden = archive;
    for (const [id, selected] of [["general-link", !archive], ["archive-link", archive]]) {
      document.getElementById(id).disabled = busy;
      document.getElementById(id).setAttribute("aria-pressed", String(selected));
    }
    document.getElementById("folder-count").textContent = String((archive ? archiveFolders : folders).length);
    document.getElementById("folder-empty").hidden = (archive ? archiveFolders : folders).length > 0;
    document.getElementById("sidebar-foot").textContent = `ローカル保存 · ${archive ? "Archive" : "General"}`;
    const archiveList = document.getElementById("archive-folders");
    archiveList.replaceChildren();
    archiveList.hidden = !archive;
    function folderLabel(button, folder) {
      const name = document.createElement("span");
      name.className = "folder-label";
      name.textContent = folder.name;
      const count = document.createElement("span");
      count.className = "folder-count";
      count.textContent = folder.count == null ? "—" : String(folder.count);
      button.append(name, count);
    }
    if (archive) {
      archiveFolders.forEach(folder => {
        const button = document.createElement("button");
        folderLabel(button, folder);
        button.dataset.source = "archive";
        button.dataset.folder = folder.name;
        button.setAttribute("aria-current", String(currentFolder === folder.name));
        button.disabled = folderBusy || composerBusy;
        button.addEventListener("click", () => selectFolder("archive", folder.name));
        archiveList.appendChild(button);
      });
    }
    folders.forEach(folder => {
      const button = document.createElement("button");
      folderLabel(button, folder);
      button.dataset.source = folder.source;
      button.dataset.folder = folder.folder;
      button.className = "folder-name";
      button.dataset.folderId = folder.id;
      button.setAttribute("aria-current", String(folder.source === currentSource && folder.folder === currentFolder));
      button.title = "ドラッグ、または Alt + ↑ / ↓ で並び替え";
      button.draggable = !folderBusy && !composerBusy;
      button.disabled = folderBusy || composerBusy;
      button.addEventListener("click", () => {
        selectFolder(folder.source, folder.folder);
      });
      if (folder.source === "notes") {
        button.addEventListener("contextmenu", event => {
          event.preventDefault();
          if (!folderBusy && !composerBusy) openFolderMenu(button, folder);
        });
        button.title += "。右クリックで名前変更・削除";
      }
      button.addEventListener("dragstart", e => {
        draggedFolder = folder.id;
        e.dataTransfer.setData("text/plain", folder.id);
        e.dataTransfer.effectAllowed = "move";
      });
      button.addEventListener("dragend", () => { draggedFolder = null; });
      button.addEventListener("dragover", e => {
        if (draggedFolder !== null && !folderBusy) e.preventDefault();
      });
      button.addEventListener("drop", e => {
        e.preventDefault();
        if (draggedFolder !== null) moveFolder(draggedFolder, folders.findIndex(f => f.id === folder.id));
        draggedFolder = null;
      });
      button.addEventListener("keydown", e => {
        if (!e.altKey || !["ArrowUp", "ArrowDown"].includes(e.key)) return;
        e.preventDefault();
        moveFolder(folder.id, folders.findIndex(f => f.id === folder.id) + (e.key === "ArrowUp" ? -1 : 1));
      });
      list.appendChild(button);
    });
  }

  function updateSidebarCounts() {
    if (!fragmentsReady) return;
    const entry = currentSource === "archive"
      ? archiveFolders.find(folder => folder.name === currentFolder)
      : folders.find(folder => folder.source === currentSource && folder.folder === currentFolder);
    if (entry) entry.count = allFragments.length;
    document.querySelectorAll("#folder-list button, #archive-folders button").forEach(button => {
      const folder = button.dataset.source === "archive"
        ? archiveFolders.find(folder => folder.name === button.dataset.folder)
        : folders.find(folder => folder.source === button.dataset.source && folder.folder === button.dataset.folder);
      if (folder) button.querySelector(".folder-count").textContent = folder.count == null ? "—" : String(folder.count);
    });
    const counts = new Map();
    allFragments.forEach(fragment => new Set(fragment.tags).forEach(tag => counts.set(tag, (counts.get(tag) || 0) + 1)));
    const buttons = [...document.querySelectorAll("#tag-filters .tag-btn")];
    if (buttons.length !== counts.size || buttons.some(button => !counts.has(button.dataset.tag))) {
      renderTagFilters([...counts.keys()].sort());
    } else {
      buttons.forEach(button => { button.querySelector(".tag-count").textContent = String(counts.get(button.dataset.tag)); });
    }
  }

  function changeFolderState(oldName, newName) {
    rememberScrollPosition();
    for (const source of ["notes", "archive"]) {
      const oldScope = new URLSearchParams({ source, folder: oldName }).toString();
      const newScope = new URLSearchParams({ source, folder: newName || "" }).toString();
      if (folderScrollPositions.has(oldScope)) {
        if (newName) folderScrollPositions.set(newScope, folderScrollPositions.get(oldScope));
        if (newName || source === "notes") folderScrollPositions.delete(oldScope);
      }
      for (const [key, draft] of [...editDrafts]) {
        const [scope, id] = JSON.parse(key);
        if (scope !== oldScope || (!newName && source === "archive")) continue;
        editDrafts.delete(key);
        if (newName) editDrafts.set(JSON.stringify([newScope, id]), draft);
      }
    }
    if (currentFolder === oldName && (currentSource === "notes" || (newName && currentSource === "archive"))) {
      currentFolder = newName || "";
      if (!newName) { currentSource = "inbox"; activeTags.clear(); }
      rememberFolderSelection();
    }
  }

  function openFolderMenu(button, folder) {
    document.querySelector(".folder-menu")?.remove();
    const menu = document.createElement("div");
    menu.className = "folder-menu";
    menu.innerHTML = `<button type="button">名前を変更</button><button type="button">フォルダを削除</button>`;
    document.body.appendChild(menu);
    const rect = button.getBoundingClientRect();
    menu.style.left = `${Math.min(rect.left, window.innerWidth - 200)}px`;
    menu.style.top = `${Math.min(rect.bottom, window.innerHeight - 100)}px`;
    const [rename, remove] = menu.querySelectorAll("button");
    rename.addEventListener("click", async () => {
      menu.remove();
      const name = window.prompt("新しいフォルダ名（Archive内の同名フォルダも変更します）", folder.name);
      if (name === null || name === folder.name) return;
      folderBusy = true;
      renderFolders();
      try {
        await request(`/api/folders/${encodeURIComponent(folder.name)}`, {
          method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name }),
        });
        changeFolderState(folder.name, name);
        await loadFolders();
      } catch (error) { showError(error); }
      finally { folderBusy = false; renderFolders(); }
    });
    remove.addEventListener("click", async () => {
      menu.remove();
      folderBusy = true;
      renderFolders();
      try {
        const preview = await request(`/api/folders/${encodeURIComponent(folder.name)}/delete-preview`);
        if (!await confirmFolderDeletion(`「${folder.name}」と記事${preview.count}件を完全に削除します。元に戻せません。`)) return;
        await request(`/api/folders/${encodeURIComponent(folder.name)}`, {
          method: "DELETE", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ revision: preview.revision }),
        });
        changeFolderState(folder.name, null);
        await loadFolders();
      } catch (error) { showError(error); }
      finally { folderBusy = false; renderFolders(); }
    });
    menu.addEventListener("keydown", event => {
      if (event.key === "Escape") { menu.remove(); button.focus(); }
    });
    rename.focus();
  }

  document.addEventListener("click", event => {
    if (!event.target.closest(".folder-menu")) document.querySelector(".folder-menu")?.remove();
  });

  async function moveFolder(name, target) {
    if (composerBusy || folderBusy || target < 0 || target >= folders.length) return;
    const ordered = folders.map(f => f.id);
    const index = ordered.indexOf(name);
    if (index < 0 || index === target) return;
    ordered.splice(index, 1);
    ordered.splice(target, 0, name);
    folderBusy = true;
    renderFolders();
    try {
      folders = await request("/api/navigation/order", {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ names: ordered }),
      });
      document.getElementById("status-message").hidden = true;
    } catch (error) { showError(error); }
    finally {
      folderBusy = false;
      renderFolders();
      [...document.querySelectorAll(".folder-name")].find(b => b.dataset.folderId === name)?.focus();
    }
  }

  async function loadFolders() {
    const source = currentSource;
    try {
      const [result, archived] = await Promise.all([
        request("/api/navigation"),
        source === "archive" ? request("/api/folders?source=archive") : Promise.resolve([]),
      ]);
      if (source !== currentSource) return;
      const missingCounts = [...result, ...archived].some(folder => folder.count == null);
      function preserveCounts(entries, previous, key) {
        const counts = new Map(previous.map(folder => [folder[key], folder.count]));
        return entries.map(folder => ({ ...folder, count: folder.count ?? counts.get(folder[key]) }));
      }
      folders = preserveCounts(result, folders, "id");
      if (source === "archive") archiveFolders = preserveCounts(archived, archiveFolders, "name");
      if (currentSource === "archive" && !currentFolder && archiveFolders.length) {
        currentFolder = archiveFolders[0].name;
        rememberFolderSelection();
      }
      renderFolders();
      await load();
      if (missingCounts && source === currentSource) {
        showError(new Error("フォルダ件数を取得できません。ビューアを再起動してページを再読み込みしてください。未取得の件数は「—」で表示します。"));
      }
    } catch (error) { showError(error); }
  }

  document.getElementById("add-folder").addEventListener("click", () => {
    document.getElementById("folder-form").hidden = false;
    document.getElementById("folder-name").focus();
  });
  function closeFolderForm() {
    document.getElementById("folder-form").hidden = true;
    document.getElementById("folder-form").reset();
  }
  document.getElementById("folder-cancel").addEventListener("click", closeFolderForm);
  document.getElementById("folder-name").addEventListener("keydown", e => {
    if (e.key === "Escape") closeFolderForm();
  });
  document.getElementById("folder-form").addEventListener("submit", async e => {
    e.preventDefault();
    if (composerBusy || folderBusy) return;
    folderBusy = true;
    renderFolders();
    try {
      const folder = await request("/api/folders", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: document.getElementById("folder-name").value.trim() }),
      });
      rememberScrollPosition();
      currentSource = "notes";
      currentFolder = folder.name;
      rememberFolderSelection();
      activeTags.clear();
      closeFolderForm();
      await loadFolders();
    } catch (error) { showError(error); }
    finally { folderBusy = false; renderFolders(); }
  });

  // フォルダごとの表示位置。nullは最下部を表し、永続保存しない。
  const folderScrollPositions = new Map();
  const viewerScroll = document.getElementById("viewer-scroll");
  let displayedScrollKey = null;
  let restoringScroll = null;

  function rememberScrollPosition() {
    if (displayedScrollKey !== null) {
      const atBottom = viewerScroll.scrollHeight - viewerScroll.clientHeight - viewerScroll.scrollTop <= 2;
      const position = restoringScroll ? restoringScroll.position : (atBottom ? null : viewerScroll.scrollTop);
      folderScrollPositions.set(displayedScrollKey, position);
    }
    displayedScrollKey = null;
    restoringScroll = null;
  }

  function applyScrollPosition() {
    if (!restoringScroll || restoringScroll.key !== displayedScrollKey) return;
    if (restoringScroll.anchor) {
      const card = [...document.querySelectorAll("#cards > .card")].find(card => card.dataset.id === restoringScroll.anchor.id);
      if (card) {
        viewerScroll.scrollTop += card.getBoundingClientRect().top - visibleArticleTop() - restoringScroll.anchor.offset;
        restoringScroll.position = viewerScroll.scrollTop;
        return;
      }
    }
    viewerScroll.scrollTop = restoringScroll.position === null
      ? viewerScroll.scrollHeight : restoringScroll.position;
  }

  function restoreScrollPosition(key) {
    displayedScrollKey = key;
    restoringScroll = { key, position: folderScrollPositions.has(key) ? folderScrollPositions.get(key) : null };
    applyScrollPosition();
  }

  // 画像の遅延読み込みで高さが変わっても復元する。ユーザー操作を優先する。
  const scrollResizeObserver = new ResizeObserver(applyScrollPosition);
  scrollResizeObserver.observe(document.getElementById("cards"));
  scrollResizeObserver.observe(viewerScroll);
  for (const event of ["wheel", "touchstart", "pointerdown", "keydown"]) {
    viewerScroll.addEventListener(event, () => { restoringScroll = null; }, { passive: true });
  }

  // --- データ取得 ---
  async function load() {
    expandedArticles.clear();
    searchExpandedArticles.clear();
    document.getElementById("search-scroll").scrollTop = 0;
    closeTagSuggestions();
    rememberScrollPosition();
    const version = ++loadVersion;
    fragmentsReady = false;
    allFragments = [];
    renderTagFilters([]);
    render();
    try {
      const query = scopeQuery();
      const [frags, tags] = await Promise.all([
        request(`/api/fragments?${query}`), request(`/api/tags?${query}`),
      ]);
      if (version !== loadVersion) return;
      allFragments = frags;
      fragmentsReady = true;
      renderTagFilters(tags);
      render();
      restoreScrollPosition(query.toString());
      document.getElementById("status-message").hidden = true;
    } catch (error) { if (version === loadVersion) showError(error); }
  }

  function visibleArticleTop() {
    const viewport = viewerScroll.getBoundingClientRect();
    const header = document.querySelector("#viewer-scroll > header");
    return Math.max(viewport.top, header ? header.getBoundingClientRect().bottom : viewport.top);
  }

  function renderTagChange() {
    const top = visibleArticleTop();
    const bottom = viewerScroll.getBoundingClientRect().bottom;
    const ids = new Set(filtered().map(fragment => fragment.id));
    const cards = [...document.querySelectorAll("#cards > .card")];
    const card = cards.find(card => {
      const bounds = card.getBoundingClientRect();
      return ids.has(card.dataset.id) && bounds.bottom > top && bounds.top < bottom;
    });
    const anchor = card ? { id: card.dataset.id, offset: card.getBoundingClientRect().top - top } : null;
    const position = viewerScroll.scrollTop;
    restoringScroll = null;
    render();
    restoringScroll = { key: displayedScrollKey, position, anchor };
    applyScrollPosition();
  }

  // --- タグフィルターボタン ---
  function renderTagFilters(tags) {
    const container = document.getElementById("tag-filters");
    // トグルボタンを残してタグボタンだけ削除
    [...container.querySelectorAll(".tag-btn, .geo-tag-group")].forEach(el => el.remove());
    const geoGroup = document.createElement("div");
    geoGroup.className = "geo-tag-group";
    tags.forEach(tag => {
      const btn = document.createElement("button");
      btn.className = "tag-btn";
      const label = document.createElement("span");
      label.className = "tag-label";
      label.textContent = `# ${tag}`;
      const count = document.createElement("span");
      count.className = "tag-count";
      count.textContent = String(allFragments.filter(fragment => fragment.tags.includes(tag)).length);
      btn.appendChild(label);
      btn.appendChild(count);
      btn.dataset.tag = tag;
      btn.classList.toggle("active", activeTags.has(tag));
      btn.title = "右クリックでタグ名を変更";
      btn.addEventListener("contextmenu", event => {
        event.preventDefault();
        openTagRename(btn, tag);
      });
      btn.addEventListener("click", () => {
        if (activeTags.has(tag)) {
          activeTags.delete(tag);
          btn.classList.remove("active");
        } else {
          activeTags.add(tag);
          btn.classList.add("active");
        }
        renderTagChange();
      });
      (tag.startsWith("geo_") ? geoGroup : container).appendChild(btn);
    });
    container.appendChild(geoGroup);
    applyTagSearch();
  }

  function tagMatchesSearch(tag, query, selected) {
    const term = query.trim().replace(/^#/, "").toLocaleLowerCase();
    return selected || tag.toLocaleLowerCase().includes(term);
  }

  function applyTagSearch() {
    const query = document.getElementById("tag-search").value;
    document.querySelectorAll("#tag-filters .tag-btn").forEach(button => {
      button.hidden = !tagMatchesSearch(button.dataset.tag, query, activeTags.has(button.dataset.tag));
    });
    const geoGroup = document.querySelector("#tag-filters .geo-tag-group");
    if (geoGroup) geoGroup.hidden = ![...geoGroup.querySelectorAll(".tag-btn")].some(button => !button.hidden);
    document.getElementById("tag-count").textContent = String([...document.querySelectorAll("#tag-filters .tag-btn")].filter(button => !button.hidden).length);
  }

  document.getElementById("tag-search").addEventListener("input", applyTagSearch);
  document.getElementById("tag-search").addEventListener("keydown", event => {
    if (event.key === "Escape" && !event.isComposing) {
      event.preventDefault();
      event.target.value = "";
      applyTagSearch();
    }
  });

  function openTagRename(trigger, tag) {
    if (folderBusy || composerBusy || (currentSource !== "inbox" && !currentFolder)) return;
    const folder = currentFolder || "inbox";
    const scopes = [new URLSearchParams({ source: folder === "inbox" ? "inbox" : "notes", folder: folder === "inbox" ? "" : folder }).toString(), new URLSearchParams({ source: "archive", folder }).toString()];
    if ([...editDrafts.keys()].some(key => scopes.includes(JSON.parse(key)[0]))) {
      showError(new Error("対象フォルダの記事の編集を保存または取り消してから、タグ名を変更してください"));
      return;
    }
    document.querySelector(".tag-rename-panel")?.remove();
    const panel = document.createElement("form");
    panel.className = "tag-rename-panel";
    panel.innerHTML = `<div>タグ名を変更</div><div class="tag-rename-scope"></div><input aria-label="新しいタグ名" required pattern="[\\p{L}\\p{N}_]+"><div><button type="submit">変更</button><button type="button">取消</button></div><div role="alert"></div>`;
    panel.querySelector(".tag-rename-scope").textContent = `${folder} と同名のArchive内の記事が対象です。`;
    const input = panel.querySelector("input");
    input.value = tag;
    document.body.appendChild(panel);
    const rect = trigger.getBoundingClientRect();
    panel.style.left = `${Math.max(8, Math.min(rect.left, window.innerWidth - 310))}px`;
    panel.style.top = `${Math.max(8, Math.min(rect.bottom, window.innerHeight - 190))}px`;
    input.focus();
    input.select();
    const cancel = panel.querySelector('button[type="button"]');
    cancel.addEventListener("click", () => { panel.remove(); trigger.focus(); });
    panel.addEventListener("keydown", event => {
      if (event.key === "Escape" && !folderBusy) { panel.remove(); trigger.focus(); }
    });
    const scope = scopeQuery().toString();
    panel.addEventListener("submit", async event => {
      event.preventDefault();
      if (folderBusy || composerBusy) return;
      if (scope !== scopeQuery().toString()) { panel.remove(); return; }
      folderBusy = true;
      panel.querySelectorAll("input, button").forEach(el => { el.disabled = true; });
      renderFolders();
      try {
        const result = await request(`/api/tags/rename?${scope}`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ old: tag, new: input.value }),
        });
        if (activeTags.delete(tag)) activeTags.add(result.new);
        closeTagSuggestions();
        panel.remove();
        await load();
        showError(new Error(`${result.count}件の記事のタグ名を変更しました。`));
      } catch (error) { panel.querySelector('[role="alert"]').textContent = error.message; }
      finally {
        folderBusy = false;
        panel.querySelectorAll("input, button").forEach(el => { el.disabled = false; });
        renderFolders();
      }
    });
  }

  // --- フィルタリング ---
  function matchesFilters(f, tags = activeTags, includeSearch = false) {
    if (showFavoritesOnly && !f.tags.includes("favorite")) return false;
    if (tags.size > 0) {
      if (tagMode === "AND") {
        if (![...tags].every(t => f.tags.includes(t))) return false;
      } else {
        if (![...tags].some(t => f.tags.includes(t))) return false;
      }
    }
    if (includeSearch && searchQuery) {
      const q = searchQuery.toLowerCase();
      if (!f.content.toLowerCase().includes(q)) return false;
    }
    if (includeSearch && dateFrom && f.created_at.slice(0, 10) < dateFrom) return false;
    if (includeSearch && dateTo && f.created_at.slice(0, 10) > dateTo) return false;
    return true;
  }

  function filtered(includeSearch = false) {
    return allFragments.filter(f => matchesFilters(f, undefined, includeSearch))
      .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  }

  function updateTagButtonAvailability() {
    document.querySelectorAll(".tag-btn").forEach(btn => {
      const tag = btn.dataset.tag;
      const unavailable = tagMode === "AND"
        && !activeTags.has(tag)
        && !allFragments.some(f => matchesFilters(f, new Set([...activeTags, tag])));
      btn.disabled = unavailable;
      btn.title = unavailable ? "No matching notes" : "";
    });
  }

  // --- コンテンツ描画 ---
  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderMarkdownContent(content, imageLinks = [], repairId = null, attachments = [], tagLines = []) {
    if (!content) return "";
    // Protect only server-recognized tag lines before parsing Markdown.
    const prefix = `FRAGMENTBOXTAG${crypto.randomUUID().replaceAll("-", "")}X`;
    const lines = content.split("\n");
    const tags = new Map();
    tagLines.forEach(number => {
      const marker = `${prefix}${number}Z`;
      tags.set(marker, lines[number]);
      lines[number] = marker;
    });
    const parser = new marked.Marked({ breaks: true });
    parser.use({ renderer: {
      html(token) { return escapeHtml(token.text); },
      image(token) {
        // Keep image reference checks, repairs, and the lightbox.
        return renderLine(`![${token.text}](${token.href})`, imageLinks, repairId, attachments);
      },
      link(token) {
        if (/^(?:\.\.\/)*assets\/attachment_[a-f0-9]{32}\.[a-z0-9]+$/.test(token.href)
            || /^\/assets\/attachment_[a-f0-9]{32}\.[a-z0-9]+$/.test(token.href)) {
          return renderLine(token.raw, imageLinks, repairId, attachments);
        }
        return false;
      },
      paragraph(token) {
        const rawLines = token.raw.trimEnd().split("\n");
        const result = [];
        let previous = 0;
        for (let i = 0; i < rawLines.length; i++) {
          if (!/^https?:\/\/\S+$/.test(rawLines[i].trim())) continue;
          let end = i + 1;
          let title = false;
          while (end < rawLines.length && /^(title|sitename|description):/.test(rawLines[end])) {
            if (/^title:\s*\S/.test(rawLines[end])) title = true;
            end++;
          }
          if (!title) continue;
          while (end < rawLines.length && /^!\[[^\]]*\]\([^)]+\)$/.test(rawLines[end].trimEnd())) end++;
          if (i > previous) result.push(parser.parse(rawLines.slice(previous, i).join("\n")));
          result.push(renderContent(rawLines.slice(i, end).join("\n"), imageLinks, repairId, attachments));
          previous = end;
          i = end - 1;
        }
        if (!result.length) return false;
        if (previous < rawLines.length) result.push(parser.parse(rawLines.slice(previous).join("\n")));
        return result.join("");
      },
    } });
    // Raw HTML is escaped; sanitization also rejects unsafe Markdown link URLs.
    let result = DOMPurify.sanitize(parser.parse(lines.join("\n")), {
      USE_PROFILES: { html: true }, FORBID_ATTR: ["style"], ADD_ATTR: ["target"],
    });
    tags.forEach((line, marker) => {
      const spans = escapeHtml(line).replace(/#([\p{L}\p{N}_]+)/gu,
        '<span class="tag-inline" data-tag="$1">#$1</span>');
      result = result.replaceAll(marker, spans);
    });
    return result;
  }

  function renderLine(raw, imageLinks = [], repairId = null, attachments = [], isTagLine = false) {
    // 行末スペース2つ（Markdown強制改行）を除去
    const line = raw.replace(/  $/, "");

    if (!line) return `<div class="line-empty"></div>`;

    const attachmentMatch = line.match(/^\[[^\]]*\]\(((?:\.\.\/)*assets\/|\/assets\/)(attachment_[a-f0-9]{32}\.[a-z0-9]+)\)$/);
    if (attachmentMatch) {
      const asset = attachmentMatch[2];
      const file = attachments.find(item => item.asset === asset);
      if (!file || file.size === null) return `<div class="image-link-warning">添付ファイルが見つかりません: ${escapeHtml(file?.name || asset)}</div>`;
      const ext = asset.split(".").pop();
      const audio = ["mp3", "wav", "aiff", "aif", "flac", "m4a", "ogg"].includes(ext);
      const kind = ext === "pdf" ? "pdf" : audio ? "audio" : ["mid", "midi"].includes(ext) ? "midi" : "text";
      const symbol = { pdf: "PDF", audio: "♪", midi: "MIDI", text: "TXT" }[kind];
      const size = file.size < 1024 ? `${file.size} B` : file.size < 1024 ** 2 ? `${(file.size / 1024).toFixed(1)} KB` : `${(file.size / 1024 ** 2).toFixed(2)} MB`;
      return `<div class="attachment-card"><span class="attachment-icon attachment-${kind}" aria-hidden="true">${symbol}</span><div class="attachment-info"><a class="attachment-open" href="/assets/${asset}" data-asset="${asset}" title="既定のアプリで開く">${escapeHtml(file.name)}</a><span class="attachment-size">${size}</span></div><a class="attachment-download" href="/assets/${asset}" download="${escapeHtml(file.name)}" title="元のファイル名でダウンロード" aria-label="${escapeHtml(file.name)}をダウンロード"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg></a></div>`;
    }

    // Markdown画像: ![alt](path) 単独行
    const imgMatch = line.match(/^!\[(.*)\]\((.*)\)$/);
    if (imgMatch) {
      const alt = imgMatch[1];
      const link = imageLinks.find(link => link.original === imgMatch[2]);
      if (link?.status === "missing") {
        return `<div class="image-link-warning">画像が見つかりません: ${escapeHtml(link.original)}</div>`;
      }
      const notice = link?.status === "corrected"
        ? `<div class="image-link-notice"><details class="image-link-warning"><summary>リンク補正あり</summary><div>MDの参照: ${escapeHtml(link.original)}</div><div>正しい参照: ${escapeHtml(link.corrected)}</div></details>${repairId !== null ? `<button class="repair-images-btn" data-id="${escapeHtml(repairId)}" title="この記事の画像リンクを修正" aria-label="この記事の画像リンクを修正">fix</button>` : ""}</div>` : "";
      const src = link?.url || imgMatch[2].replace(/^(?:\.\.\/)+assets\//, "/assets/");
      return `${notice}<div class="line-image"><img class="fragment-image" src="${escapeHtml(src)}" alt="${escapeHtml(alt)}" loading="lazy" onerror="this.insertAdjacentHTML('afterend','<span class=\\'fragment-image-missing\\'>(画像なし)</span>');this.remove()"></div>`;
    }

    // メタデータ行: title: / sitename: / description:
    const metaMatch = line.match(/^(title|sitename|description):\s*(.*)/);
    if (metaMatch) {
      return `<div class="line-meta"><span class="meta-key">${metaMatch[1]}:</span><span class="meta-value">${escapeHtml(metaMatch[2])}</span></div>`;
    }

    // 通常行: URL・タグをハイライト
    let html = escapeHtml(line);
    html = html.replace(/(https?:\/\/\S+)/g, '<a class="url" href="$1" target="_blank" rel="noopener">$1</a>');
    if (isTagLine) html = html.replace(/#([\p{L}\p{N}_]+)/gu, '<span class="tag-inline" data-tag="$1">#$1</span>');
    return `<div class="line-text">${html}</div>`;
  }

  function renderContent(content, imageLinks = [], repairId = null, attachments = [], tagLines = []) {
    const lines = content.split("\n").map(l => l.replace(/  $/, ""));
    const result = [];
    let lastWasEmpty = false;
    let i = 0;

    while (i < lines.length) {
      const line = lines[i];

      // URL単独行 → 後続メタデータを先読みしてタイトルリンクに変換
      if (/^https?:\/\/\S+$/.test(line.trim())) {
        const url = line.trim();
        let title = null, sitename = null, description = null;
        let j = i + 1;

        while (j < lines.length) {
          const next = lines[j].replace(/  $/, "");
          let m;
          if ((m = next.match(/^title:\s*(.*)/)))       { title = m[1]; j++; }
          else if ((m = next.match(/^sitename:\s*(.*)/)))   { sitename = m[1]; j++; }
          else if ((m = next.match(/^description:\s*(.*)/))) { description = m[1]; j++; }
          else break;
        }

        if (title) {
          let html = `<div class="url-source"><a class="url" href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a></div><div class="url-block">`;
          if (sitename)    html += `<div class="line-meta">${escapeHtml(sitename)}</div>`;
          html += `<a class="url-title" href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(title)}</a>`;
          if (description) html += `<div class="line-meta description">${escapeHtml(description)}</div>`;
          // メタデータ直後の連続画像を同じリンクにまとめる。
          const thumbnails = [];
          while (j < lines.length && /^!\[[^\]]*\]\([^)]+\)$/.test(lines[j])) {
            thumbnails.push(`<div class="link-thumbnail">${renderLine(lines[j], imageLinks, repairId, attachments)}</div>`);
            j++;
          }
          if (thumbnails.length) html += `<div class="link-thumbnails${thumbnails.length > 1 ? " multiple" : ""}">${thumbnails.join("")}</div>`;
          html += `</div>`;
          result.push(html);
          lastWasEmpty = false;
          i = j;
        } else {
          result.push(`<div class="line-text"><a class="url" href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a></div>`);
          lastWasEmpty = false;
          i++;
        }
        continue;
      }

      const rendered = renderLine(line, imageLinks, repairId, attachments, tagLines.includes(i));
      const isEmpty = rendered.includes("line-empty");
      if (isEmpty && lastWasEmpty) { i++; continue; }
      lastWasEmpty = isEmpty;
      result.push(rendered);
      i++;
    }

    return result.join("");
  }

  function editKey(id) {
    return JSON.stringify([scopeQuery().toString(), id]);
  }

  function splitEditParts(content) {
    const lines = content.match(/[^\n]*\n|[^\n]+$/g) || [];
    const parts = [];
    let text = "";
    for (let i = 0; i < lines.length;) {
      let j = i + 1;
      let hasTitle = false;
      if (/^https?:\/\/\S+$/.test(lines[i].trim())) {
        while (j < lines.length && /^(title|sitename|description):/.test(lines[j])) {
          if (/^title:\s*\S/.test(lines[j])) hasTitle = true;
          j++;
        }
      }
      if (hasTitle) {
        while (j < lines.length && /^!\[[^\]]*\]\([^)]+\)$/.test(lines[j].trim())) j++;
        parts.push({ type: "text", raw: text });
        parts.push({ type: "link", raw: lines.slice(i, j).join("") });
        text = "";
        i = j;
      } else { text += lines[i++]; }
    }
    parts.push({ type: "text", raw: text });
    return parts;
  }

  function serializeEditParts(parts) {
    let result = "";
    parts.forEach((part, index) => {
      if (part.type === "link" && result && !result.endsWith("\n")) result += "\n";
      result += part.raw;
      if (part.type === "link" && parts.slice(index + 1).some(p => p.raw) && !result.endsWith("\n")) result += "\n";
    });
    return result;
  }

  function renderArticleBody(fragment, searchResult = false) {
    const draft = searchResult ? null : editDrafts.get(editKey(fragment.id));
    if (!draft) {
      const characters = Array.from(fragment.content);
      const long = characters.length > 2000;
      const expanded = long && (searchResult ? searchExpandedArticles : expandedArticles).has(editKey(fragment.id));
      const content = long && !expanded ? characters.slice(0, 2000).join("") : fragment.content;
      const lines = content.split("\n");
      const tagLines = (fragment.tag_lines || []).filter(number =>
        number < lines.length && (!long || expanded || number < lines.length - 1));
      const body = renderMarkdownContent(content, fragment.image_links, fragment.id, fragment.attachments, tagLines);
      return body + (long ? `<button type="button" class="article-expand-btn" data-id="${escapeHtml(fragment.id)}" aria-expanded="${expanded}">${expanded ? "折りたたむ" : "続きを読む"}</button>` : "");
    }
    if (!draft.parts) draft.parts = splitEditParts(draft.content);
    const parts = draft.parts.map((part, index) => part.type === "link"
      ? `<div class="edit-link-card">${renderContent(part.raw, fragment.image_links, null, fragment.attachments)}<button type="button" class="edit-remove-link" data-part="${index}" aria-label="リンクカードを削除" ${draft.busy ? "disabled" : ""}>×</button></div>`
      : `<textarea class="edit-textarea" data-part="${index}" aria-label="記事本文" spellcheck="false" ${draft.busy ? "disabled" : ""}>${escapeHtml(part.raw)}</textarea>`).join("");
    return `<div class="inline-editor">${parts}
      <div class="edit-error" role="alert">${escapeHtml(draft.error || "")}</div>
      <div class="edit-buttons">
        <input class="edit-files" type="file" multiple hidden>
        <button type="button" class="edit-attach" ${draft.busy ? "disabled" : ""}>${draft.uploading ? "添付中…" : "添付"}</button>
        <button class="edit-cancel" ${draft.busy ? "disabled" : ""}>Cancel</button>
        <button class="edit-save" ${draft.busy ? "disabled" : ""}>${draft.busy && !draft.uploading ? "保存中…" : "Save"}</button>
      </div>
    </div>`;
  }

  function toggleArticleExpansion(button) {
    const fragment = allFragments.find(item => item.id === button.dataset.id);
    const searchResult = !!button.closest("#search-cards");
    if (!fragment || (!searchResult && editDrafts.has(editKey(fragment.id)))) return;
    const key = editKey(fragment.id);
    const expanded = searchResult ? searchExpandedArticles : expandedArticles;
    const collapsing = expanded.has(key);
    if (collapsing) expanded.delete(key);
    else expanded.add(key);
    const card = button.closest(".card");
    if (!searchResult) restoringScroll = null;
    card.querySelector(".card-body").innerHTML = renderArticleBody(fragment, searchResult);
    if (collapsing) {
      const scroll = searchResult ? document.getElementById("search-scroll") : viewerScroll;
      const top = searchResult ? scroll.getBoundingClientRect().top : visibleArticleTop();
      const offset = card.getBoundingClientRect().top - top;
      if (offset < 0) scroll.scrollTop += offset;
    }
    card.querySelector(".article-expand-btn")?.focus({ preventScroll: true });
  }

  function formatDatetime(iso) {
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  // --- カード描画 ---

  function moveCandidates(entries, source, folder, query) {
    const term = query.trim().toLocaleLowerCase();
    return entries.filter(entry => entry.source !== "archive"
      && !(entry.source === source && entry.folder === folder)
      && entry.name.toLocaleLowerCase().includes(term));
  }

  function openMovePicker(trigger) {
    document.querySelector(".move-picker")?.remove();
    const source = currentSource, folder = currentFolder;
    const scope = scopeQuery().toString(), id = trigger.dataset.id;
    const picker = document.createElement("div");
    picker.className = "move-picker";
    picker.innerHTML = `<input type="search" placeholder="フォルダを検索" aria-label="移動先フォルダを検索" role="combobox" aria-expanded="true" aria-controls="move-options" aria-autocomplete="list"><div id="move-options" role="listbox" aria-label="移動先フォルダ"></div><div class="move-error" role="alert"></div>`;
    trigger.closest(".card-footer").appendChild(picker);
    const viewport = document.getElementById("viewer-scroll").getBoundingClientRect();
    if (trigger.getBoundingClientRect().top - viewport.top < 260) {
      picker.style.bottom = "auto";
      picker.style.top = "calc(100% + 6px)";
    }
    const input = picker.querySelector("input"), list = picker.querySelector("[role=listbox]");
    let matches = [], selected = 0, busy = false;
    function paint() {
      matches = moveCandidates(folders, source, folder, input.value);
      selected = Math.max(0, Math.min(selected, matches.length - 1));
      list.replaceChildren();
      input.removeAttribute("aria-activedescendant");
      matches.forEach((entry, index) => {
        const option = document.createElement("button");
        option.type = "button";
        option.id = `move-option-${index}`;
        option.setAttribute("role", "option");
        option.setAttribute("aria-selected", String(index === selected));
        option.textContent = entry.name;
        option.disabled = busy;
        option.addEventListener("click", () => move(entry));
        list.appendChild(option);
        if (index === selected) input.setAttribute("aria-activedescendant", option.id);
      });
      if (!matches.length) list.textContent = "移動先がありません";
    }
    async function move(entry) {
      if (busy || scope !== scopeQuery().toString()) return;
      busy = true;
      input.disabled = true;
      const buttons = trigger.closest(".card").querySelectorAll("button");
      buttons.forEach(button => { button.disabled = true; });
      picker.querySelector(".move-error").textContent = "";
      try {
        await request(`/api/fragments/${encodeURIComponent(id)}/move?${scope}`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ source: entry.source, folder: entry.folder }),
        });
        picker.remove();
        if (scope !== scopeQuery().toString()) return;
        allFragments = allFragments.filter(fragment => fragment.id !== id);
        const destination = folders.find(folder => folder.id === entry.id);
        if (destination?.count != null) destination.count += 1;
        renderTagFilters([...new Set(allFragments.flatMap(fragment => fragment.tags))].sort());
        render();
      } catch (error) {
        picker.querySelector(".move-error").textContent = error.message;
      } finally {
        busy = false;
        input.disabled = false;
        buttons.forEach(button => { button.disabled = false; });
      }
    }
    input.addEventListener("input", () => { selected = 0; paint(); });
    picker.addEventListener("keydown", event => {
      if (event.isComposing) return;
      if (event.key === "Escape") {
        event.preventDefault();
        picker.remove();
        trigger.focus();
      } else if (!busy && ["ArrowDown", "ArrowUp"].includes(event.key)) {
        event.preventDefault();
        selected += event.key === "ArrowDown" ? 1 : -1;
        paint();
        list.querySelector('[aria-selected="true"]')?.scrollIntoView({ block: "nearest" });
        input.focus();
      } else if (!busy && event.key === "Enter" && event.target === input) {
        event.preventDefault();
        if (matches[selected]) move(matches[selected]);
      }
    });
    paint();
    input.focus();
  }

  function editTagCompletion(value, start, end, fragments) {
    if (start !== end) return null;
    const match = value.slice(0, start).match(/(?:^|\s)#([\p{L}\p{N}_]*)$/u);
    if (!match) return null;
    const query = match[1].toLocaleLowerCase();
    const tags = [...new Set(fragments.flatMap(fragment => fragment.tags))]
      .filter(tag => tag.toLocaleLowerCase().startsWith(query))
      .sort((a, b) => a.localeCompare(b));
    const suffix = value.slice(start).match(/^[\p{L}\p{N}_]*/u)[0];
    return { start: start - match[1].length - 1, end: start + suffix.length, tags };
  }

  let tagSuggestionState = null;

  function closeTagSuggestions() {
    if (!tagSuggestionState) return;
    tagSuggestionState.popup.remove();
    tagSuggestionState.input.removeAttribute("aria-controls");
    tagSuggestionState.input.removeAttribute("aria-activedescendant");
    tagSuggestionState = null;
  }

  function selectTagSuggestion() {
    const state = tagSuggestionState;
    if (!state || !state.input.isConnected || state.input.disabled) return;
    const tag = state.completion.tags[state.index];
    state.input.setRangeText(`#${tag}`, state.completion.start, state.completion.end, "end");
    const input = state.input;
    closeTagSuggestions();
    input.dispatchEvent(new Event("input", { bubbles: true }));
    closeTagSuggestions();
    input.focus({ preventScroll: true });
  }

  function paintTagSuggestions() {
    const state = tagSuggestionState;
    state.popup.replaceChildren();
    state.completion.tags.forEach((tag, index) => {
      const option = document.createElement("button");
      option.type = "button";
      option.id = `edit-tag-option-${index}`;
      option.setAttribute("role", "option");
      option.setAttribute("aria-selected", String(index === state.index));
      option.textContent = `#${tag}`;
      option.addEventListener("mousedown", event => event.preventDefault());
      option.addEventListener("click", () => { state.index = index; selectTagSuggestion(); });
      state.popup.appendChild(option);
    });
    state.input.setAttribute("aria-activedescendant", `edit-tag-option-${state.index}`);
  }

  function updateTagSuggestions(input) {
    closeTagSuggestions();
    if (input.disabled || !input.isConnected || (input === postText && (folderBusy || !canPost()))) return;
    const completion = editTagCompletion(input.value, input.selectionStart, input.selectionEnd, allFragments);
    if (!completion || !completion.tags.length) return;
    const popup = document.createElement("div");
    popup.className = "edit-tag-suggestions";
    popup.id = "edit-tag-options";
    popup.setAttribute("role", "listbox");
    popup.setAttribute("aria-label", "このフォルダのタグ候補");
    input.insertAdjacentElement("afterend", popup);
    input.setAttribute("aria-controls", popup.id);
    tagSuggestionState = { input, popup, completion, index: 0 };
    paintTagSuggestions();
  }

  document.getElementById("cards").addEventListener("compositionstart", closeTagSuggestions);
  document.getElementById("cards").addEventListener("compositionend", event => {
    if (event.target.classList.contains("edit-textarea")) updateTagSuggestions(event.target);
  });
  document.getElementById("cards").addEventListener("click", event => {
    if (event.target.classList.contains("edit-textarea")) updateTagSuggestions(event.target);
  });
  document.addEventListener("focusin", event => {
    if (tagSuggestionState && event.target !== tagSuggestionState.input
        && !tagSuggestionState.popup.contains(event.target)) closeTagSuggestions();
  });
  document.addEventListener("pointerdown", event => {
    if (tagSuggestionState && event.target !== tagSuggestionState.input
        && !tagSuggestionState.popup.contains(event.target)) closeTagSuggestions();
  });
  document.getElementById("cards").addEventListener("keyup", event => {
    if (event.target.classList.contains("edit-textarea") && !event.isComposing
        && ["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) updateTagSuggestions(event.target);
  });

  function handleTagSuggestionKey(e) {
    if (e.isComposing || e.target.disabled) return false;
    const suggestions = tagSuggestionState;
    if (suggestions && suggestions.input === e.target && suggestions.popup.isConnected) {
      if (e.key === "Escape") {
        e.preventDefault();
        closeTagSuggestions();
        return true;
      }
      if (!e.ctrlKey && !e.metaKey && !e.altKey && ["ArrowUp", "ArrowDown", "Enter"].includes(e.key)) {
        e.preventDefault();
        if (e.key === "Enter") selectTagSuggestion();
        else {
          suggestions.index = (suggestions.index + (e.key === "ArrowDown" ? 1 : -1) + suggestions.completion.tags.length) % suggestions.completion.tags.length;
          paintTagSuggestions();
          suggestions.popup.querySelector('[aria-selected="true"]')?.scrollIntoView({ block: "nearest" });
        }
        return true;
      }
      if (e.key === "Tab") closeTagSuggestions();
    }
    return false;
  }

  postText.addEventListener("input", event => {
    if (!event.isComposing) updateTagSuggestions(postText);
  });
  postText.addEventListener("compositionstart", closeTagSuggestions);
  postText.addEventListener("compositionend", () => updateTagSuggestions(postText));
  postText.addEventListener("click", () => updateTagSuggestions(postText));
  postText.addEventListener("keyup", event => {
    if (!event.isComposing && ["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) updateTagSuggestions(postText);
  });
  postText.addEventListener("keydown", handleTagSuggestionKey);
  document.getElementById("composer").addEventListener("submit", closeTagSuggestions);

  async function attachEditFiles(id, files) {
    const draft = editDrafts.get(editKey(id));
    if (!draft || draft.busy || !composerReady) return;
    const selected = [...files];
    if (!selected.length) return;
    const scope = scopeQuery().toString();
    draft.busy = true;
    draft.uploading = true;
    draft.error = "";
    closeTagSuggestions();
    render();
    try {
      for (const file of selected) {
        if (!supportedAttachment(file)) throw new Error(`${file.name}: 対応していないファイル形式です`);
        const isImage = supportedImage(file);
        const limit = isImage ? imageMaxBytes : attachmentMaxBytes;
        if (file.size > limit) throw new Error(`${file.name}: ${limit / 1024 / 1024} MiB以下にしてください`);
        const result = await request(`/api/${isImage ? "images" : "attachments"}?${new URLSearchParams({ filename: file.name })}`, {
          method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: file,
        });
        draft.content += (draft.content && !draft.content.endsWith("\n") ? "  \n" : "") + result.markdown;
        draft.parts = splitEditParts(draft.content);
      }
    } catch (error) { draft.error = error.message; }
    finally {
      draft.busy = false;
      draft.uploading = false;
      if (scope === scopeQuery().toString()) render();
    }
  }

  document.getElementById("cards").addEventListener("change", e => {
    if (e.target.classList.contains("edit-files")) {
      attachEditFiles(e.target.closest(".card").dataset.id, e.target.files);
    }
  });

  async function saveEdit(id) {
    const key = editKey(id);
    const draft = editDrafts.get(key);
    if (!draft || draft.busy) return;
    const scope = scopeQuery().toString();
    draft.busy = true;
    draft.error = "";
    render();
    try {
      const updated = await request(`/api/fragments/${encodeURIComponent(id)}?${scope}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: draft.content, remove_unused_thumbnails: true, enrich_links: true }),
      });
      editDrafts.delete(key);
      if (scope !== scopeQuery().toString()) return;
      const idx = allFragments.findIndex(f => f.id === id);
      if (idx !== -1) allFragments[idx] = updated;
      if (updated.warnings?.length) showError(new Error(`保存しました。${updated.warnings.join(" / ")}`));
    } catch (error) {
      draft.busy = false;
      draft.error = error.message;
    }
    if (scope === scopeQuery().toString()) render();
  }

  document.getElementById("cards").addEventListener("input", e => {
    if (!e.target.classList.contains("edit-textarea")) return;
    const draft = editDrafts.get(editKey(e.target.closest(".card").dataset.id));
    if (draft && !draft.busy) {
      draft.parts[Number(e.target.dataset.part)].raw = e.target.value;
      draft.content = serializeEditParts(draft.parts);
      if (!e.isComposing) updateTagSuggestions(e.target);
    }
  });

  document.getElementById("cards").addEventListener("keydown", e => {
    if (!e.target.classList.contains("edit-textarea") || e.isComposing) return;
    const id = e.target.closest(".card").dataset.id;
    const draft = editDrafts.get(editKey(id));
    if (!draft || draft.busy) return;
    if (handleTagSuggestionKey(e)) return;
    if (e.key === "Escape") {
      e.preventDefault();
      editDrafts.delete(editKey(id));
      render();
    } else if ((e.ctrlKey || e.metaKey) && (e.key === "Enter" || e.key.toLowerCase() === "s")) {
      e.preventDefault();
      saveEdit(id);
    }
  });

  let pendingDeleteId = null;

  function showConfirm(id) {

  function hideConfirm() {

    document.getElementById("confirm-overlay").style.display = "none";

  async function handleArticleClick(e) {
    const expandButton = e.target.closest(".article-expand-btn");
    if (expandButton) {
      toggleArticleExpansion(expandButton);
      return;
    }
    const attachment = e.target.closest(".attachment-open");
    if (attachment) {
      e.preventDefault();
      if (attachment.getAttribute("aria-busy") === "true") return;
      attachment.setAttribute("aria-busy", "true");
      try {
        await request(`/api/attachments/${encodeURIComponent(attachment.dataset.asset)}/open`, {
          method: "POST", headers: { "X-Fragmentbox-Open": "1" },
        });
      } catch (error) { showError(error); }
      finally { attachment.removeAttribute("aria-busy"); }
      return;
    }

    if (e.target.classList.contains("article-menu-btn")) {
      const menu = e.target.parentElement.querySelector(".article-menu");
      const opening = menu.hidden;
      closeArticleMenus();
      if (opening) {
        menu.hidden = false;
        e.target.setAttribute("aria-expanded", "true");
        const viewport = viewerScroll.getBoundingClientRect();
        const above = e.target.getBoundingClientRect().top - visibleArticleTop();
        menu.classList.toggle("below", above < menu.offsetHeight && viewport.bottom - e.target.getBoundingClientRect().bottom > menu.offsetHeight);
        menu.querySelector("button").focus({ preventScroll: true });
      }
      return;
    }
    if (e.target.closest(".article-menu")) closeArticleMenus();
    if (e.target.classList.contains("move-btn")) {
      if (currentSource !== "archive" && !editDrafts.has(editKey(e.target.dataset.id))) openMovePicker(e.target.closest(".card-footer").querySelector(".article-menu-btn"));
      return;
    }
    if (e.target.classList.contains("archive-btn") || e.target.classList.contains("restore-btn")) {
      const action = e.target.classList.contains("restore-btn") ? "restore" : "archive";
      const id = e.target.dataset.id;
      if (editDrafts.has(editKey(id))) return;
      const scope = scopeQuery().toString();
      const buttons = e.target.closest(".card").querySelectorAll("button");
      buttons.forEach(button => { button.disabled = true; });
      try {
        await request(`/api/fragments/${encodeURIComponent(id)}/${action}?${scope}`, { method: "POST" });
        if (scope !== scopeQuery().toString()) return;
        allFragments = allFragments.filter(f => f.id !== id);
        const tags = [...new Set(allFragments.flatMap(f => f.tags))].sort();
        renderTagFilters(tags);
        render();
        if (action === "restore") await loadFolders();
      } catch (error) { showError(error); }
      finally { buttons.forEach(button => { button.disabled = false; }); }
      return;
    }
    if (e.target.classList.contains("repair-images-btn")) {
      const id = e.target.dataset.id;
      const fragment = allFragments.find(f => f.id === id);
      if (!fragment || editDrafts.has(editKey(id))) return;
      const scope = scopeQuery().toString();
      e.target.disabled = true;
      try {
        const updated = await request(`/api/fragments/${encodeURIComponent(id)}/repair-image-links?${scope}`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content: fragment.content }),
        });
        if (scope !== scopeQuery().toString()) return;
        const index = allFragments.findIndex(f => f.id === id);
        if (index !== -1) allFragments[index] = updated;
        render();
      } catch (error) { showError(error); }
      finally { e.target.disabled = false; }
      return;
    }
    if (e.target.classList.contains("edit-remove-link")) {
      const draft = editDrafts.get(editKey(e.target.closest(".card").dataset.id));
      if (draft && !draft.busy) {
        draft.parts.splice(Number(e.target.dataset.part), 1);
        draft.parts = draft.parts.reduce((parts, part) => {
          if (part.type === "text" && parts.at(-1)?.type === "text") parts.at(-1).raw += part.raw;
          else parts.push(part);
          return parts;
        }, []);
        draft.content = serializeEditParts(draft.parts);
        render();
      }
      return;
    }
    if (e.target.classList.contains("edit-attach")) {
      const card = e.target.closest(".card");
      const draft = editDrafts.get(editKey(card.dataset.id));
      if (!draft || draft.busy) return;
      if (!composerReady) {
        draft.error = "添付設定を取得できていません。ページを再読み込みしてください。";
        render();
        return;
      }
      const input = card.querySelector(".edit-files");
      input.accept = [...imageExtensions, ...attachmentExtensions].join(",");
      input.value = "";
      input.click();
      return;
    }
    if (e.target.classList.contains("edit-save") || e.target.classList.contains("edit-cancel")) {
      const id = e.target.closest(".card").dataset.id;
      if (e.target.classList.contains("edit-save")) await saveEdit(id);
      else if (!editDrafts.get(editKey(id))?.busy) { editDrafts.delete(editKey(id)); render(); }
      return;
    }
    if (e.target.classList.contains("fragment-image")) {
      lightboxImg.src = e.target.src;
      lightboxImg.alt = e.target.alt;
      lightbox.style.display = "flex";
      return;
    }
    if (e.target.classList.contains("fav-btn")) {
      const id = e.target.dataset.id;
      const scope = scopeQuery().toString();
      try {
        const data = await request(`/api/fragments/${encodeURIComponent(id)}/favorite?${scope}`, { method: "PATCH" });
        if (scope !== scopeQuery().toString()) return;
        const frag = allFragments.find(f => f.id === id);
        if (frag) Object.assign(frag, { tags: data.tags, content: data.content, tag_lines: data.tag_lines });
        renderTagChange();
      } catch (error) { showError(error); }
      return;
    }
    if (e.target.classList.contains("edit-btn")) {
      const id = e.target.dataset.id;
      const frag = allFragments.find(f => f.id === id);
      if (frag) showEdit(id, frag.content);
      return;
    }
    if (e.target.classList.contains("delete-btn")) {
      showConfirm(e.target.dataset.id);
      return;
    }
    const tag = e.target.dataset.tag;
    if (!tag) return;
    activeTags.add(tag);
    const btn = document.querySelector(`.tag-btn[data-tag="${tag}"]`);
    if (btn) btn.classList.add("active");
    renderTagChange();
  }
  document.getElementById("cards").addEventListener("click", handleArticleClick);
  document.getElementById("search-cards").addEventListener("click", handleArticleClick);

  // --- 右カラムの検索 ---
  function renderSearchResults() {
    if (document.getElementById("search-panel").hidden) return;
    document.getElementById("search-heading").textContent = `検索: ${currentFolder || (currentSource === "archive" ? "Archive" : "Inbox")}`;
    const hasQuery = !!(searchQuery || dateFrom || dateTo);
    const results = hasQuery ? filtered(true) : [];
    document.getElementById("search-count").textContent = hasQuery ? `${results.length} notes` : "";
    const empty = document.getElementById("search-empty");
    empty.hidden = results.length > 0;
    empty.textContent = hasQuery ? "一致する記事はありません。" : "検索する言葉や期間を指定してください。";
    document.getElementById("date-clear-btn").style.display = (dateFrom || dateTo) ? "" : "none";
    document.getElementById("search-cards").innerHTML = results.map(fragment => `
      <div class="card" data-id="${escapeHtml(fragment.id)}">
        <div class="card-datetime">${formatDatetime(fragment.created_at)}</div>
        <div class="card-body">${renderArticleBody(fragment, true)}</div>
      </div>
    `).join("");
  }

  let searchReadingPosition = null;
  function setSearchOpen(open) {
    const panel = document.getElementById("search-panel");
    if (open === !panel.hidden) return;
    if (open || !searchMobile.matches) {
      const top = visibleArticleTop();
      const card = [...document.querySelectorAll("#cards > .card")].find(card => card.getBoundingClientRect().bottom > top);
      searchReadingPosition = { key: displayedScrollKey, position: viewerScroll.scrollTop,
        anchor: card ? { id: card.dataset.id, offset: card.getBoundingClientRect().top - top } : null };
    }
    panel.hidden = !open;
    document.body.classList.toggle("search-open", open);
    document.getElementById("search-toggle").setAttribute("aria-expanded", String(open));
    syncSearchAccessibility();
    if (open) {
      restoringScroll = searchReadingPosition;
      applyScrollPosition();
      renderSearchResults();
      document.getElementById("search").focus();
    } else {
      searchQuery = dateFrom = dateTo = "";
      for (const id of ["search", "date-from", "date-to"]) document.getElementById(id).value = "";
      searchExpandedArticles.clear();
      document.getElementById("search-status").hidden = true;
      document.getElementById("search-cards").replaceChildren();
      document.getElementById("search-scroll").scrollTop = 0;
      // モバイルは開く直前、PCは閉じる直前の記事位置へ戻す。
      restoringScroll = searchReadingPosition;
      applyScrollPosition();
      document.getElementById("search-toggle").focus({ preventScroll: true });
    }
  }

  const searchMobile = window.matchMedia("(max-width: 760px)");
  function syncSearchAccessibility() {
    const covered = searchMobile.matches && !document.getElementById("search-panel").hidden;
    document.querySelector("main").inert = covered;
    document.getElementById("folder-pane").inert = covered;
  }
  searchMobile.addEventListener("change", syncSearchAccessibility);
  document.getElementById("search-toggle").addEventListener("click", () => setSearchOpen(document.getElementById("search-panel").hidden));
  for (const id of ["search-close", "search-back"]) document.getElementById(id).addEventListener("click", () => setSearchOpen(false));
  document.getElementById("search-panel").addEventListener("keydown", event => {
    if (event.key === "Escape" && !event.isComposing && lightbox.style.display === "none") {
      event.preventDefault();
      setSearchOpen(false);
    }
  });
  function updateSearchResults() {
    searchExpandedArticles.clear();
    document.getElementById("search-scroll").scrollTop = 0;
    renderSearchResults();
  }
  document.getElementById("search").addEventListener("input", e => {
    searchQuery = e.target.value.trim();
    updateSearchResults();
  });

  document.getElementById("date-from").addEventListener("change", e => { dateFrom = e.target.value; updateSearchResults(); });
  document.getElementById("date-to").addEventListener("change",   e => { dateTo   = e.target.value; updateSearchResults(); });
  document.getElementById("date-clear-btn").addEventListener("click", () => {
    dateFrom = dateTo = "";
    document.getElementById("date-from").value = "";
    document.getElementById("date-to").value = "";
    updateSearchResults();
  });

  document.getElementById("tag-clear-btn").addEventListener("click", () => {
    activeTags.clear();
    document.querySelectorAll(".tag-btn.active").forEach(b => b.classList.remove("active"));
    renderTagChange();
  });

  document.getElementById("tag-mode-btn").addEventListener("click", () => {
    tagMode = tagMode === "AND" ? "OR" : "AND";
    document.getElementById("tag-mode-btn").textContent = tagMode;
    render();
  });

  document.getElementById("fav-filter-btn").addEventListener("click", () => {
    showFavoritesOnly = !showFavoritesOnly;
    document.getElementById("fav-filter-btn").classList.toggle("active", showFavoritesOnly);
    render();
  });

  function selectFolder(source, folder) {
    if (composerBusy || folderBusy) return;
    rememberScrollPosition();
    closeFolderForm();
    currentSource = source;
    currentFolder = folder;
    rememberFolderSelection();
    activeTags.clear();
    renderFolders();
    load();
  }

  function selectArea(archive) {
    if (composerBusy || folderBusy || archive === (currentSource === "archive")) return;
    rememberScrollPosition();
    closeFolderForm();
    currentSource = archive ? "archive" : "inbox";
    currentFolder = "";
    rememberFolderSelection();
    activeTags.clear();
    document.getElementById("tag-search").value = "";
    ++loadVersion;
    allFragments = [];
    fragmentsReady = false;
    renderTagFilters([]);
    renderFolders();
    render();
    loadFolders();
  }
  document.getElementById("general-link").addEventListener("click", () => selectArea(false));
  document.getElementById("archive-link").addEventListener("click", () => selectArea(true));

  try {
    const selection = readFolderSelection();
    currentSource = selection.source;
    currentFolder = selection.folder;
    updateComposer();
    initComposer();
    loadFolders();
  } catch (error) { showError(error); }
</script>
</body>
</html>
